app:
  name: "UniLLM Platform"
  version: "0.3.0"
  debug: true
  host: "0.0.0.0"
  port: 8000
  # CORS 白名单。["*"] 表示放开全部来源；此时凭证开关会被强制关闭
  # （浏览器规范禁止 "*" 与 allow_credentials 同时生效）。
  cors_origins:
    - "*"
  cors_allow_credentials: false
  # 鉴权开关：false 时 /api/* 与 /v1/* 全部免鉴权（本地开发）
  auth_enabled: true
  # 团队访问 Token。留空 => 启动时自动生成并写入 api_token_file，并在日志中打印
  api_token: ""
  # 自动生成 Token 的持久化位置（相对路径锚定项目根）
  api_token_file: "./data/.api_token"

database:
  type: "sqlite"
  path: "./data/unillm.db"

storage:
  datasets_path: "./data/datasets"
  annotations_path: "./data/annotations"
  models_path: "./data/models"
  logs_path: "./logs"

model:
  default_model: "Qwen/Qwen2.5-7B-Instruct"
  max_model_len: 4096
  gpu_memory_utilization: 0.9
  tensor_parallel_size: 1

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.1
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"

training:
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  logging_steps: 10
  save_steps: 100

evaluation:
  metrics:
    - "perplexity"
    - "accuracy"
    - "latency"
